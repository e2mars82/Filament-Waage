[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I boards
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  ; GPIO27 wird ausschließlich von der Anwendung geschaltet.
  ; Kein TFT_BL: TFT_eSPI darf das Backlight in init() nicht einschalten.
  -D TOUCH_CS=33
  -D LOAD_GLCD=1
  -D SPI_FREQUENCY=40000000
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bogde/HX711@^0.7.5
  adafruit/Adafruit PN532@^1.3.4
  bblanchon/ArduinoJson@^7.0.4
  ESP32Async/ESPAsyncWebServer@^3.6.0
  ESP32Async/AsyncTCP@^3.3.2
